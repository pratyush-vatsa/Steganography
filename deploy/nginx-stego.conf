# Nginx reverse proxy config for a Linux VM deployment (Google Cloud
# e2-micro, Oracle Cloud, or any VPS - nothing here is provider-specific).
# Puts nginx on port 80/443 (public) in front of gunicorn on 127.0.0.1:8000
# (internal only). This lets you add a free TLS cert (certbot) later
# without touching the app itself.
#
# Install:
#   sudo cp deploy/nginx-stego.conf /etc/nginx/sites-available/stego
#   sudo ln -s /etc/nginx/sites-available/stego /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Replace server_name with your VM's public IP or domain.

server {
    listen 80;
    server_name _;

    client_max_body_size 64M;  # match Flask's MAX_CONTENT_LENGTH (MAX_UPLOAD_MB)

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Match gunicorn's --timeout 120 - large cover images take longer
        # to process, and nginx's own default (60s) would otherwise cut
        # the request off before gunicorn finishes.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
